<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sellout Crowds Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      html, body {
        background-color: transparent !important;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        /* 1. Stops iOS from inflating text and squishing your Game Details tabs */
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
      }
    </style>

    <script>
      // 2. The mathematical counter-strike to the iOS Webview bug
      function fixTrappedIframe() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        // If we are on a phone, but the iframe is acting like a desktop monitor (> 600px)
        if (isMobile && window.innerWidth > 600) {
          const screenWidth = window.screen.width || 390;
          // Calculate exactly how much the native app is shrinking the screen
          const scaleFactor = window.innerWidth / screenWidth;
          
          // Blow our app up by that exact amount so they cancel each other out
          document.body.style.zoom = scaleFactor;
        }
      }
      window.addEventListener('DOMContentLoaded', fixTrappedIframe);
    </script>
    <!-- Removed iframe-resizer script completely to restore native scrolling and fix the height cutoff -->
  </head>
  <body class="text-gray-200 antialiased no-scrollbar">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
