<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sellout Crowds Scoreboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      /* Safe, standard constraints to prevent iOS Webviews from expanding the width */
      html, body {
        background-color: transparent !important;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        max-width: 100vw;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        max-width: 100vw;
        overflow-x: hidden;
      }
    </style>

    <script>
      window.iFrameResizer = {
        targetOrigin: '*',
        sizeWidth: false,
        checkOrigin: false,
        scrolling: false,
        heightCalculationMethod: 'bodyOffset'
      };
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.contentWindow.min.js"></script>
  </head>
  <body class="text-gray-200 antialiased no-scrollbar">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
