<!doctype html>
<html lang="en" class="no-scrollbar" style="background: transparent !important; background-color: transparent !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Sellout Crowds Scoreboard</title>
    <meta name="description" content="Native sports scoreboard and fantasy integration for Sellout Crowds." />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        overflow-x: hidden !important;
        background: transparent !important;
        background-color: transparent !important;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        margin: 0 !important;
        padding: 0 !important;
      }
      body {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        overflow-x: hidden !important;
        background: transparent !important;
        background-color: transparent !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        overflow-x: hidden !important;
        background: transparent !important;
        background-color: transparent !important;
      }
    </style>
    <!-- Configure iframe-resizer with high-performance bodyOffset calculation and disabled sizeWidth -->
    <script>
      window.iFrameResizer = {
        targetOrigin: '*',
        sizeWidth: false,
        checkOrigin: false,
        scrolling: false,
        widthCalculationMethod: 'rightMostElement',
        heightCalculationMethod: 'bodyOffset'
      };
    </script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/4.3.9/iframeResizer.contentWindow.min.js"></script>
  </head>
  <body class="no-scrollbar" style="background: transparent !important; background-color: transparent !important;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
